<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HIE Calculator</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#191919;color:#e6e6e6;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  h1{font-size:20px;letter-spacing:.5px;margin:0 0 12px;}
  p{font-size:14px;color:#b8b8b8;max-width:320px;line-height:1.5;}
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">HIE Calculator</h1>
    <p id="message">Connect to the internet and reopen the app to load the calculator.</p>
  </div>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('es')) {
      document.documentElement.lang = 'es';
      document.title = 'Calculadora de EHI';
      document.getElementById('title').textContent = 'Calculadora de EHI';
      document.getElementById('message').textContent = 'Conéctese a internet y vuelva a abrir la aplicación para cargar la calculadora.';
    }
  </script>
</body>
</html>
